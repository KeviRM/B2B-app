services:
  # Nginx
  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default-local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - b2b-network

  # Aplicación Backend 
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/html
    networks:
      - b2b-network

  # Base de Datos 
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: b2b_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: b2b_user
      MYSQL_PASSWORD: secretpassword
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - b2b-network

  # Frontend 
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - b2b-network

networks:
  b2b-network:
    driver: bridge

volumes:
  dbdata: